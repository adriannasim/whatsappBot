name: Test and deploy to Pterodactyl

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second main-branch release must not move :production while another deploys it.
concurrency:
  group: pterodactyl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run runtime:check
      # Tests use fixtures; no WhatsApp/API login or live messages.
      - run: npm test

  release:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (vars.PTERODACTYL_PUBLISH_ENABLED == 'true' || vars.PTERODACTYL_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      BOT_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify deployment configuration without stopping the bot
        if: vars.PTERODACTYL_DEPLOY_ENABLED == 'true'
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
          PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
        run: node scripts/pterodactyl-deploy.mjs --check
      - name: Choose the lowercase GHCR image name
        id: image
        shell: bash
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the tested revision
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pterodactyl/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:production
          build-args: |
            BOT_REVISION=${{ github.sha }}
      - name: Stop, set the expected revision, and start the server
        if: vars.PTERODACTYL_DEPLOY_ENABLED == 'true'
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
          PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
        run: node scripts/pterodactyl-deploy.mjs
